<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITRE}}</title>
<style>
  :root {
    --h: {{COULEUR}};
    --accent: hsl(var(--h) 65% 42%);
    --accent-doux: hsl(var(--h) 80% 96%);
    --accent-bord: hsl(var(--h) 55% 85%);
    --fond: #f6f7f9;
    --carte: #ffffff;
    --texte: #1d2330;
    --texte-2: #5b6474;
    --jaune: #fff6d6;
    --jaune-bord: #f1d372;
    --ombre: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 10px rgba(20, 30, 50, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: hsl(var(--h) 70% 68%);
      --accent-doux: hsl(var(--h) 30% 18%);
      --accent-bord: hsl(var(--h) 30% 30%);
      --fond: #12151b;
      --carte: #1b2029;
      --texte: #e8ebf1;
      --texte-2: #a3abb9;
      --jaune: #2f2a17;
      --jaune-bord: #6b5a1f;
      --ombre: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .onglet-radio { position: absolute; opacity: 0; pointer-events: none; }

  header {
    background: var(--accent); color: #fff; padding: 20px 16px 18px;
  }
  @media (prefers-color-scheme: dark) { header { background: hsl(var(--h) 45% 26%); } }
  .matiere {
    display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 99px;
  }
  h1 { margin: 8px 0 2px; font-size: 26px; line-height: 1.2; }
  .date { margin: 0; font-size: 14px; opacity: .85; }

  nav {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 10px 16px;
    background: var(--fond); border-bottom: 1px solid var(--accent-bord);
  }
  nav label {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 12px; cursor: pointer;
    font-weight: 600; font-size: 15px; color: var(--texte-2); background: var(--carte);
    border: 1px solid var(--accent-bord); user-select: none;
  }
  #t-fiche:checked ~ nav label[for="t-fiche"],
  #t-jeux:checked ~ nav label[for="t-jeux"],
  #t-visuel:checked ~ nav label[for="t-visuel"] {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .onglet-radio:focus-visible ~ nav { outline: 2px solid var(--accent); }

  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .panneau { display: none; }
  #t-fiche:checked ~ main .p-fiche,
  #t-jeux:checked ~ main .p-jeux,
  #t-visuel:checked ~ main .p-visuel { display: block; }

  .resume {
    font-size: 18px; margin: 0 0 16px; padding: 14px 16px; border-radius: 14px;
    background: var(--accent-doux); border-left: 5px solid var(--accent);
  }
  .bloc {
    background: var(--carte); border-radius: 16px; padding: 14px 16px 6px; margin-bottom: 14px;
    box-shadow: var(--ombre); border: 1px solid transparent;
  }
  @media (prefers-color-scheme: dark) { .bloc { border-color: #262c37; } }
  h2 { font-size: 19px; margin: 0 0 8px; color: var(--accent); }
  h3 { font-size: 16.5px; margin: 12px 0 4px; }
  .notion:first-of-type h3 { margin-top: 4px; }
  ul, ol { margin: 0 0 10px; padding-left: 22px; }
  li { margin: 3px 0; }
  li::marker { color: var(--accent); }
  strong { color: var(--accent); font-weight: 700; }

  dl { margin: 0 0 8px; }
  dt { font-weight: 700; margin-top: 8px; }
  dd { margin: 2px 0 0; padding-left: 12px; border-left: 3px solid var(--accent-bord); color: var(--texte); }

  .reperes-liste { list-style: none; padding: 0; }
  .reperes-liste li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--accent-bord); }
  .reperes-liste li:last-child { border-bottom: 0; }
  .badge {
    flex: none; font-weight: 700; font-size: 14.5px; padding: 2px 9px; border-radius: 8px;
    background: var(--accent-doux); color: var(--accent); border: 1px solid var(--accent-bord);
    font-variant-numeric: tabular-nums; max-width: 55%;
  }

  .retenir { background: var(--jaune); border: 1px solid var(--jaune-bord); }
  .retenir h2 { color: inherit; }
  .retenir ol { padding-left: 0; list-style: none; counter-reset: n; }
  .retenir li { counter-increment: n; position: relative; padding-left: 36px; margin: 8px 0; font-weight: 500; }
  .retenir li::before {
    content: counter(n); position: absolute; left: 0; top: 1px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .plus-loin {
    border: 1px dashed var(--accent-bord); border-radius: 14px; padding: 10px 16px; margin-bottom: 14px;
    color: var(--texte-2);
  }
  .plus-loin summary { cursor: pointer; font-weight: 600; color: var(--texte); }
  .plus-loin ul { margin-top: 8px; }

  mark.illisible { background: #ffd9d9; color: #8a1c1c; border-radius: 4px; padding: 0 4px; font-size: .9em; }

  .bientot { text-align: center; padding: 40px 16px; color: var(--texte-2); }
  .bientot .gros { font-size: 44px; }
  footer { text-align: center; color: var(--texte-2); font-size: 13px; padding: 8px 16px 28px; }

  @media print {
    body { background: #fff; font-size: 12.5px; }
    nav, .p-jeux, .p-visuel, footer, .plus-loin:not([open]) { display: none !important; }
    .p-fiche { display: block !important; }
    header { background: none; color: #000; padding: 0 0 6px; border-bottom: 2px solid #000; }
    .matiere { background: none; padding: 0; }
    main { padding: 8px 0; max-width: none; }
    .bloc { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; padding: 8px 12px 2px; }
  }
</style>
</head>
<body>
  <input class="onglet-radio" type="radio" name="onglet" id="t-fiche" checked>
  <input class="onglet-radio" type="radio" name="onglet" id="t-jeux">
  <input class="onglet-radio" type="radio" name="onglet" id="t-visuel">

  <header>
    <span class="matiere">{{MATIERE}}</span>
    <h1>{{CHAPITRE}}</h1>
    <p class="date">Fiche du {{DATE}}</p>
  </header>

  <nav>
    <label for="t-fiche">📝 Fiche</label>
    <label for="t-jeux">🎮 Jeux</label>
    <label for="t-visuel">🗺️ Visuel</label>
  </nav>

  <main>
    <div class="panneau p-fiche">
{{FICHE}}
    </div>
    <div class="panneau p-jeux">
      <div class="bientot"><div class="gros">🎮</div>Flashcards, QCM, textes à trous… arrivent bientôt !</div>
    </div>
    <div class="panneau p-visuel">
      <div class="bientot"><div class="gros">🗺️</div>Carte mentale et frise chronologique arrivent bientôt !</div>
    </div>
  </main>

  <footer>RéviZ · fait à partir de ton cours</footer>

  <script type="application/json" id="reviz-data">{{DATA}}</script>
</body>
</html>
